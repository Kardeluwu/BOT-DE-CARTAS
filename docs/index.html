<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Card Pulse</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--ink:#16161d;--mute:#6b6b78;--line:#e4e4ea;--acc:#5a4bff;--ok:#1f9d55;--no:#b4b4be;--pre:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#111116;--card:#1b1b22;--ink:#ececf1;--mute:#9a9aa8;--line:#2c2c36;--acc:#8b80ff;--ok:#3ecf7a;--no:#55555f;--pre:#f59e0b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
h1 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1 1 220px}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
main{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.count{color:var(--mute);font-size:13px;margin:4px 0 10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.g>summary{list-style:none;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;cursor:pointer}
.g>summary::-webkit-details-marker{display:none}
.g img{width:52px;height:52px;object-fit:contain;border-radius:6px;background:var(--bg)}
.t{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12px;color:var(--mute)}
.chip{border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.chip.pre{color:var(--pre);border-color:var(--pre)}
.price{text-align:right;white-space:nowrap}
.price b{font-size:16px}
.price div{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
td.p{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td a{color:var(--ink);text-decoration:none}
td a:hover{color:var(--acc);text-decoration:underline}
.n{display:block;font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--no)}
.dot.on{background:var(--ok)}
tr.off td{opacity:.55}
.warn{color:var(--pre);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Mi Card Pulse <small id="upd"></small></h1>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar: delta reign etb, op17…">
    <select id="game"><option value="">Todos los juegos</option><option value="pokemon">Pokémon</option><option value="one-piece">One Piece</option></select>
    <select id="type"><option value="">Todos los tipos</option></select>
    <select id="lang"><option value="">Todo idioma</option><option value="ES">Español</option><option value="EN">Inglés</option><option value="JP">Japonés</option><option value="?">Sin idioma</option></select>
    <select id="sort"><option value="price">Precio menor</option><option value="price-d">Precio mayor</option><option value="stores">Más tiendas</option><option value="name">Nombre</option></select>
    <label class="chk"><input type="checkbox" id="stock" checked> Con stock</label>
    <label class="chk"><input type="checkbox" id="pre"> Solo preventas</label>
  </div>
</header>
<main>
  <div class="count" id="count">Cargando…</div>
  <div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const clp=x=>x==null?'—':'$'+Math.round(x).toLocaleString('es-CL');
const LANG={ES:'Español',EN:'Inglés',JP:'Japonés','?':'Idioma ?'};
let DATA=[];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const q=norm($('q').value).trim().split(' ').filter(Boolean);
  const f={game:$('game').value,type:$('type').value,lang:$('lang').value,stock:$('stock').checked,pre:$('pre').checked};
  let rows=DATA.filter(g=>{
    if(f.game&&g.game!==f.game)return false;
    if(f.type&&g.type!==f.type)return false;
    if(f.lang&&g.lang!==f.lang)return false;
    if(f.stock&&!g.stores_in_stock)return false;
    if(f.pre&&!g.preorder)return false;
    if(q.length){const hay=g._s;return q.every(w=>hay.includes(w)||hay.replace(/ /g,'').includes(w))}
    return true});
  const s=$('sort').value, big=1e12;
  rows.sort(s==='name'?(a,b)=>a.label.localeCompare(b.label):s==='stores'?(a,b)=>b.stores_in_stock-a.stores_in_stock:
    s==='price-d'?(a,b)=>(b.min_price??-1)-(a.min_price??-1):(a,b)=>(a.min_price??big)-(b.min_price??big));
  $('count').textContent=`${rows.length} fichas · ${rows.reduce((n,g)=>n+g.offers.length,0)} publicaciones`;
  $('list').innerHTML=rows.slice(0,400).map(g=>{
    const offers=g.offers.filter(o=>!f.stock||o.stock);
    const max=Math.max(...g.offers.filter(o=>o.stock).map(o=>o.price));
    return `<details class="g"><summary>
      ${g.img?`<img loading="lazy" src="${esc(g.img)}" alt="">`:'<div></div>'}
      <div><div class="t">${esc(g.label)}</div><div class="meta">
        <span class="chip">${LANG[g.lang]||g.lang}</span><span class="chip">${g.game==='pokemon'?'Pokémon':'One Piece'}</span>
        ${g.preorder?'<span class="chip pre">Preventa</span>':''}<span>${g.stores_in_stock} tienda${g.stores_in_stock===1?'':'s'} con stock</span></div></div>
      <div class="price"><b>${clp(g.min_price)}</b>${g.stores_in_stock>1&&max>g.min_price?`<div>hasta ${clp(max)}</div>`:''}</div>
    </summary><table>${offers.map(o=>`<tr class="${o.stock?'':'off'}">
      <td><span class="dot ${o.stock?'on':''}"></span><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.store)}</a><span class="n">${esc(o.name)}</span></td>
      <td class="p">${clp(o.price)}</td></tr>`).join('')}</table></details>`}).join('')
    +(rows.length>400?'<div class="count">Mostrando 400. Usa los filtros para afinar.</div>':'');
}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d.groups.map(g=>({...g,_s:norm(g.label+' '+g.offers.map(o=>o.name).join(' '))}));
  const types=[...new Set(DATA.map(g=>g.type))].sort();
  $('type').innerHTML+=types.map(t=>`<option>${esc(t)}</option>`).join('');
  const dt=new Date(d.updated);
  $('upd').innerHTML='actualizado '+dt.toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'})
    +(d.failed.length?` · <span class="warn">fallaron: ${esc(d.failed.join(', '))}</span>`:'');
  render();
}).catch(()=>{$('count').textContent='Aún no hay datos. Corre el workflow una vez.'});
['q','game','type','lang','sort','stock','pre'].forEach(id=>$(id).addEventListener('input',render));
</script>
</body>
</html>
